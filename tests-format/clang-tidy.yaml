---
# .clang-tidy — shared security-focused configuration for clang-tidy-all.
#
# Extended for maximum safety:
#   - every CERT rule set is enabled (cert-c-*, cert-cpp-*, cert-posix-* and
#     cert-str34-c);
#   - the C++ Core Guidelines and concurrency families are added in full;
#   - memory and varargs analyzer checks stay enabled, including
#     clang-analyzer-unix.Malloc, clang-analyzer-valist.Uninitialized and the
#     insecureAPI buffer handling analyzer;
#   - only the opt-in performance padding analyzer stays disabled.
# WarningsAsErrors makes every finding an error, so clang-tidy-all fails when
# it reports anything.
#
# Central configuration for clang-tidy-all, maintained only in scripts.
# Targets clang-tidy 23 (C and C++).
#
# See the LICENSE file at the top of the project tree for copyright
# and license details.
Checks: |
  -*,
  android-cloexec-*,
  bugprone-*,
  cert-*,
  clang-analyzer-*,
    -clang-analyzer-optin.performance.Padding,
  concurrency-*,
  cppcoreguidelines-*,
  hicpp-uppercase-literal-suffix,
  misc-misplaced-const,
  misc-use-internal-linkage,
  performance-*,
  portability-*,
  readability-math-missing-parentheses,
  readability-redundant-casting,
CheckOptions:
  - key:   bugprone-suspicious-string-compare.StringCompareLikeFunctions
    value: buffer_cmp;token_cmp;
WarningsAsErrors: '*'
...
