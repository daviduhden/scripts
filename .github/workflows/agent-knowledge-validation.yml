name: Agent Knowledge Validation

on:
  workflow_dispatch:
    inputs:
      base:
        description: Optional base Git revision for checking the dispatched commit
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: agent-knowledge-validation-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  validate-agent-knowledge:
    name: Agent Knowledge Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The optional range check resolves the base and its merge base
          # with the dispatched commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Run canonical contract tests
        run: prove tests/agent_knowledge_validator/test_validator.pl
      - name: Run canonical worktree validation
        run: perl scripts/validate-agent-knowledge.pl --scope worktree
      - name: Validate the requested commit range
        if: inputs.base != ''
        env:
          VALIDATION_BASE: ${{ inputs.base }}
        run: |
          base=$(git rev-parse --verify --end-of-options "${VALIDATION_BASE}^{commit}")
          head=$(git rev-parse --verify HEAD)
          test "$head" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          perl scripts/validate-agent-knowledge.pl --scope range --base "$base" --head "$head"
