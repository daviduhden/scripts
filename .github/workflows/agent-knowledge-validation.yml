name: Agent Knowledge Validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: agent-knowledge-validation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate-agent-knowledge:
    name: Agent Knowledge Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Run canonical contract tests
        run: python3 -m unittest discover -s tests/agent_knowledge_validator -v
      - name: Run canonical range validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/validate-agent-knowledge.py --scope range --base "$BASE_SHA" --head "$HEAD_SHA"
