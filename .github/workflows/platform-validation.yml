name: Platform Validation

on:
  # Manual only: platform checks are not run on pushes, pull requests, or a
  # schedule. Start them from the Actions tab or with `gh workflow run`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-validation-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux platform checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install analysis tools in the disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck shfmt devscripts ksh bmake perltidy libperl-critic-perl mandoc rsync time jq
          if git ls-files -- '*.py' | grep -q .; then
            python3 -m pip install 'ruff==0.17.3'
          fi
      - name: Check and test without invoking administrative utilities
        run: |
          export TMPDIR="$RUNNER_TEMP/validation"
          mkdir -p "$TMPDIR"
          make test VALIDATION_FLAGS='--check --strict'
      - name: Measure bounded release extraction
        if: ${{ !cancelled() }}
        run: /usr/bin/time -v perl tests/profile_release_verify.pl
      - name: Show validator logs, including skipped checks
        # Validators print their log paths to the test step and retain the
        # details under TMPDIR for this step to surface even on failure.
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/validation" ]; then
            find "$RUNNER_TEMP/validation" -type f -name 'validate-*' -exec cat {} \;
          fi

  windows:
    name: Windows platform checks
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install the supported analyzer in the disposable runner
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force -Repository PSGallery
      - name: Validate batch installer and launchers
        shell: cmd  # zizmor: ignore[misfeature] required to execute the repository batch installer and launchers
        run: tests-format\validate-windows-installer.bat
      - name: Dry-run the installer
        shell: cmd  # zizmor: ignore[misfeature] required to execute the repository batch installer and launchers
        run: windows\install-windows.bat --dry-run
      - name: Stage the runner Perl in a private directory
        # Later steps exercise Win32 modules from a controlled installation
        # path. GITHUB_PATH takes effect in subsequent steps.
        shell: pwsh
        run: |
          $fixture = Join-Path $env:LOCALAPPDATA ('scripts-ci-' + [guid]::NewGuid())
          $null = New-Item -ItemType Directory -Path $fixture
          Copy-Item -LiteralPath 'C:\Strawberry\perl' -Destination $fixture -Recurse
          $perlBin = Join-Path $fixture 'perl\bin'
          & (Join-Path $perlBin 'perl.exe') -MWin32 -MWin32API::File -e 'exit 0'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $perlBin
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "SCRIPTS_CI_PRIVATE=$fixture"
      - name: Install and verify in a disposable directory
        # Deny sharing on a launcher to induce a publication failure. The
        # VERSION sentinel distinguishes rollback from a partial install.
        shell: pwsh
        run: |
          $destination = Join-Path $env:SCRIPTS_CI_PRIVATE 'scripts-install-test'
          & windows/install-windows.bat --no-path --install-dir $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $destination 'bin/update-ai-clis.cmd') --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $retired = @('bin\update-aiclis.cmd', 'windows\update-aiclis.ps1')
          foreach ($entry in $retired) {
            if (Test-Path -LiteralPath (Join-Path $destination $entry)) {
              throw "Fresh install published retired file $entry"
            }
          }
          Set-Content -LiteralPath (Join-Path $destination $retired[0]) -Value 'rem scripts-powershell-launcher'
          Set-Content -LiteralPath (Join-Path $destination $retired[1]) -Value '# retired updater'
          Add-Content -LiteralPath (Join-Path $destination 'installed-files.txt') -Value $retired
          & (Join-Path $destination 'bin/update-xerj.cmd') --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $destination 'bin/update-xerj.cmd') codex invalid-agent
          if ($LASTEXITCODE -ne 2) { throw 'xerj launcher did not reject an invalid selection' }
          $unmanaged = Join-Path $destination 'keep.txt'
          Set-Content -LiteralPath $unmanaged -Value 'unmanaged'
          $versionPath = Join-Path $destination 'VERSION'
          Set-Content -LiteralPath $versionPath -Value 'rollback sentinel'
          $launcher = Join-Path $destination 'bin/ai-purge-history.cmd'
          $lock = [IO.File]::Open($launcher, 'Open', 'Read', 'None')
          try {
            & windows/install-windows.bat --no-path --install-dir $destination
            if ($LASTEXITCODE -eq 0) { throw 'Install unexpectedly replaced a locked launcher' }
            if ((Get-Content -LiteralPath $versionPath -Raw).Trim() -ne 'rollback sentinel') {
              throw 'Install did not restore the previous version metadata'
            }
          }
          finally { $lock.Dispose() }
          & windows/install-windows.bat --no-path --install-dir $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($entry in $retired) {
            if (Test-Path -LiteralPath (Join-Path $destination $entry)) {
              throw "Reinstall retained retired file $entry"
            }
          }
          if ((Get-Content -LiteralPath $unmanaged -Raw).Trim() -ne 'unmanaged') {
            throw 'Reinstall did not preserve an unmanaged file'
          }
      - name: Analyze and format-check PowerShell
        shell: pwsh
        run: |
          Get-ChildItem windows/*.ps1, windows/test-format/*.ps1, windows/install-support/*.ps1 | ForEach-Object {
            $diagnostics = Invoke-ScriptAnalyzer -Path $_.FullName -ErrorAction Stop
            $diagnostics | Write-Output
            if ($diagnostics | Where-Object { $_.Severity -in @('Warning', 'Error') }) {
              throw "PSScriptAnalyzer reported warnings or errors in $($_.FullName)"
            }
          }
          & pwsh -NoProfile -File windows/test-format/psfmt.ps1 -c .
          if ($LASTEXITCODE -ne 0) {
            $status = $LASTEXITCODE
            & pwsh -NoProfile -File windows/test-format/psfmt.ps1 -d .
            exit $status
          }
      - name: Run PowerShell regression suites with mocked downloads
        shell: pwsh
        run: |
          & pwsh -NoProfile -File windows/test-format/tests/run-tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoProfile -File windows/tests/test-update-xerj.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoProfile -File windows/tests/test-update-ai-clis.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoProfile -File windows/tests/test-path-safety.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CRUSH_GLOBAL_DATA = $env:USERPROFILE
          & pwsh -NoProfile -File windows/ai-purge-history.ps1 -IncludeCrushData -DryRun
          if ($LASTEXITCODE -eq 0) { throw 'Purge allowed the whole user profile' }
          $env:CRUSH_GLOBAL_DATA = Join-Path $env:RUNNER_TEMP 'crush-custom'
          & pwsh -NoProfile -File windows/ai-purge-history.ps1 -IncludeCrushData -DryRun
          exit $LASTEXITCODE
      - name: Check updater entry points on Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Expected Windows PowerShell' }
          foreach ($script in @('update-xerj', 'update-ai-clis')) {
            $helpText = & powershell.exe -NoProfile -File "windows/$script.ps1" --help
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (($helpText -join "`n") -notmatch '\bswival\b') {
              throw "$script does not advertise the Swival selector"
            }
            & powershell.exe -NoProfile -File "windows/$script.ps1" invalid-agent
            if ($LASTEXITCODE -ne 2) { throw "Unexpected usage exit status for $script" }
          }
          exit 0
      - name: Run portable Perl syntax and regressions
        shell: pwsh
        run: |
          foreach ($file in @(Get-ChildItem perl/*.pl, tests-format/test-*.pl)) {
            & perl -c $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & perl tests-format/test-normalize-files.pl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & perl tests-format/test-ssh-menu.pl
          exit $LASTEXITCODE

  debian:
    name: Debian 13 isolated regression checks
    # Use Debian's runtime and package metadata for the delivery fixtures.
    # The Ubuntu job owns full linting and formatting.
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 20
    steps:
      - name: Install test tools in the disposable container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git make curl ca-certificates file perl rsync jq
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Test delivery and packaging with isolated fixtures
        run: make test-regression

  openbsd:
    name: OpenBSD platform checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Analyze and test in an isolated OpenBSD VM
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          release: "8.0"
          copyback: false
          prepare: |
            pkg_add -I bash git rsync--
          run: |
            set -eu
            for script in openbsd/*.ksh; do ksh -n "$script"; done
            /bin/sh tests-format/validate-correctness.sh --target openbsd .
            mkdir -p "$GITHUB_WORKSPACE/.tmp"
            export TMPDIR="$GITHUB_WORKSPACE/.tmp"
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory
            export GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE"
            make test-regression
