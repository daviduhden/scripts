name: OpenBSD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test on OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          # Newest OpenBSD 7.x; the action defaults to 7.9.
          release: "7"
          sync: rsync
          copyback: false
          prepare: |
            uname -a
            perl -v | head -n 2
          run: |
            set -eu

            echo "== environment =="
            uname -a
            perl -v | head -n 2

            echo "== regression suite =="
            make test-regression

            echo "== audits =="
            sh tests-format/validate-perl.sh .
            sh tests-format/validate-shell.sh .
            sh tests-format/validate-make.sh .
            sh tests-format/validate-correctness.sh --target all .
